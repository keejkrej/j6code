publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  web_socket_channel: ^3.0.3
  http: ^1.6.0
  intl: ^0.20.3
  flutter_highlight: ^0.7.0
  flutter_markdown: ^0.7.7+1
  crypto: ^3.0.7
  file_picker: ^13.1.0
  sqlite3: ^3.7.0
  sqlite3_flutter_libs: ^0.6.0+eol
  xterm: ^4.0.0
  flutter_pty: ^0.4.2
  lucide_icons_flutter: ^3.1.22
  desktop_drop: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
